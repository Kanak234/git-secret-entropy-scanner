name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang-format git

      - name: Code Formatting Check
        run: |
          clang-format --dry-run --Werror include/scanner/*.hpp src/*.cpp src/cli/*.cpp tests/*.cpp

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Self Directory Scan
        run: ./build/secret_scanner_cli scan-dir include/

      - name: Run Micro-Benchmark
        run: ./build/secret_scanner_cli bench 200000
