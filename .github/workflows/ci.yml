name: CI

on:
  push:
    branches: [ main, prod-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        build_type: [Release, Debug]
        include:
          - compiler: clang
            c_compiler: clang
            cxx_compiler: clang++
          - compiler: gcc
            c_compiler: gcc
            cxx_compiler: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-format g++ git

      - name: Verify Code Formatting
        if: matrix.compiler == 'clang' && matrix.build_type == 'Release'
        run: |
          clang-format --dry-run --Werror include/scanner/*.hpp src/*.cpp src/cli/*.cpp tests/*.cpp

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Debug' && '-DENABLE_COVERAGE=ON' || '' }}

      - name: Build all targets
        run: |
          cmake --build build -j$(nproc)

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Verify code coverage (>=80% on all source files)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: |
          python3 -c "
          import subprocess, sys, glob
          objs = glob.glob('build/CMakeFiles/scanner_core.dir/src/*.o')
          out = subprocess.check_output(['gcov', '-n'] + objs, text=True)
          lines = out.splitlines()
          failed = False
          checked = 0
          for i, line in enumerate(lines):
              if 'File \'' in line and 'src/' in line:
                  fname = line.split('\'')[1]
                  if 'ThreadPool.cpp' in fname:
                      continue
                  exec_line = lines[i+1]
                  pct = float(exec_line.split(':')[1].split('%')[0])
                  print(f'{fname}: {pct}%')
                  checked += 1
                  if pct < 80.0:
                      print(f'FAIL: {fname} coverage {pct}% < 80%')
                      failed = True
          if checked == 0:
              print('ERROR: No coverage files found!')
              sys.exit(1)
          if failed:
              sys.exit(1)
          print(f'All {checked} source files meet >=80% coverage threshold.')
          "

      - name: Run Health Check
        if: matrix.build_type == 'Release'
        run: |
          ./build/secret_scanner_cli health
          ./build/secret_scanner_cli -v

      - name: Run Self Directory Scan
        if: matrix.build_type == 'Release'
        run: |
          ./build/secret_scanner_cli scan-dir include/

      - name: Run Micro-Benchmark
        if: matrix.build_type == 'Release'
        run: |
          ./build/secret_scanner_cli bench 200000

      - name: Build Docker Image
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          docker build -t secret-scanner:test .

      - name: Docker Smoke Test
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          docker run --rm secret-scanner:test health
